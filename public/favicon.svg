<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="65%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FBCFE8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FBCFE8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="fridgeGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="tvGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="fanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="cookerGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F9A8D4"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>

    <linearGradient id="screenShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94A3B8" flood-opacity="0.18"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="320" rx="72" fill="url(#bgGrad)"/>

  <!-- Ambient color glows -->
  <rect width="320" height="320" rx="72" fill="url(#glowBlue)"/>
  <rect width="320" height="320" rx="72" fill="url(#glowPurple)"/>
  <rect width="320" height="320" rx="72" fill="url(#glowPink)"/>

  <!-- Outer frame ring -->
  <rect x="44" y="44" width="232" height="232" rx="54" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" opacity="0.95" filter="url(#softShadow)"/>
  <rect x="56" y="56" width="208" height="208" rx="46" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
  <rect x="60" y="60" width="200" height="200" rx="42" fill="none" stroke="#E2E8F0" stroke-width="1" opacity="0.8"/>

  <!-- ===== APPLIANCE MOTIF ===== -->

  <!-- 1) REFRIGERATOR (left, tall) -->
  <g filter="url(#iconShadow)">
    <rect x="88" y="92" width="42" height="138" rx="14" fill="url(#fridgeGrad)"/>
    <!-- fridge top highlight -->
    <rect x="88" y="92" width="42" height="46" rx="14" fill="url(#screenShine)" opacity="0.4"/>
    <!-- divider -->
    <line x1="90" y1="152" x2="128" y2="152" stroke="#FFFFFF" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
    <!-- handle -->
    <rect x="120" y="110" width="3.5" height="16" rx="1.75" fill="#FFFFFF" opacity="0.9"/>
    <!-- subtle bottom shine -->
    <rect x="94" y="214" width="30" height="6" rx="3" fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- 2) TV (top right) -->
  <g filter="url(#iconShadow)">
    <rect x="146" y="92" width="90" height="56" rx="12" fill="url(#tvGrad)"/>
    <!-- inner screen -->
    <rect x="154" y="100" width="74" height="40" rx="7" fill="#0F172A" opacity="0.25"/>
    <!-- screen highlight -->
    <path d="M156 102 Q156 100 158 100 L224 100 Q226 100 226 102 L226 118 Q200 108 156 118 Z" fill="#FFFFFF" opacity="0.3"/>
    <!-- screen glow -->
    <rect x="154" y="100" width="74" height="40" rx="7" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.35"/>
    <!-- stand -->
    <rect x="178" y="148" width="26" height="5" rx="2.5" fill="url(#tvGrad)"/>
  </g>

  <!-- 3) FAN (bottom right) -->
  <g filter="url(#iconShadow)">
    <circle cx="192" cy="198" r="31" fill="url(#fanGrad)"/>
    <!-- soft inner glow -->
    <circle cx="192" cy="198" r="26" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.25"/>
    <!-- fan blades -->
    <path d="M192 198 L192 174 Q200 174 202 182 Z" fill="#FFFFFF" opacity="0.85"/>
    <path d="M192 198 L212 210 Q208 218 200 214 Z" fill="#FFFFFF" opacity="0.85"/>
    <path d="M192 198 L172 210 Q168 204 174 198 Z" fill="#FFFFFF" opacity="0.85"/>
    <!-- fan hub -->
    <circle cx="192" cy="198" r="9" fill="#FFFFFF"/>
    <circle cx="192" cy="198" r="4.5" fill="url(#fanGrad)"/>
    <!-- shine arc -->
    <path d="M170 184 Q176 172 192 170" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- 4) RICE COOKER (bottom left) -->
  <g filter="url(#iconShadow)">
    <rect x="94" y="212" width="46" height="36" rx="16" fill="url(#cookerGrad)"/>
    <!-- lid shine -->
    <path d="M100 214 Q117 208 134 214" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.45" stroke-linecap="round"/>
    <!-- lid divider -->
    <line x1="98" y1="225" x2="136" y2="225" stroke="#FFFFFF" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
    <!-- knob -->
    <circle cx="117" cy="212" r="4.5" fill="#FFFFFF"/>
    <circle cx="117" cy="212" r="2" fill="url(#cookerGrad)"/>
    <!-- bottom highlight -->
    <rect x="102" y="238" width="30" height="4" rx="2" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- Central connection dot -->
  <circle cx="160" cy="160" r="6" fill="#FFFFFF" filter="url(#softShadow)"/>
  <circle cx="160" cy="160" r="3.5" fill="url(#ringGrad)"/>

  <!-- Tiny sparkle accents -->
  <circle cx="72" cy="72" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="248" cy="72" r="3" fill="#A78BFA" opacity="0.6"/>
  <circle cx="72" cy="248" r="3" fill="#818CF8" opacity="0.6"/>
  <circle cx="248" cy="248" r="3" fill="#F472B6" opacity="0.6"/>

  <!-- Bottom balance accent -->
  <rect x="132" y="262" width="56" height="3.5" rx="1.75" fill="url(#ringGrad)" opacity="0.4"/>
</svg>